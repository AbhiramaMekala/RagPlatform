# Local "production" setup: the API serves the sample index from a Qdrant server.
# (The Cloud Run demo uses the built-in in-memory index instead: nothing extra to run or pay for.)
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]

volumes:
  qdrant_data:
